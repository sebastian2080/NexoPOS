<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NexoPOS - Cargando</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #1e293b;
            user-select: none;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #38bdf8;
        }
        .loading-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo">NexoPOS</div>
    <div class="loading-text">Iniciando sistema y base de datos...</div>
    <div class="spinner"></div>
</body>
</html>
